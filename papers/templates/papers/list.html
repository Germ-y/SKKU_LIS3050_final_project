{% extends "base.html" %}
{% block content %}
<h2>추천 논문 목록</h2>

{% for paper in papers %}
<div class="paper-card">
    <h3>{{ paper.title }}</h3>
    <p><strong>저자:</strong> {{ paper.authors }}</p>
    <p><strong>분야:</strong> {{ paper.category }}</p>

    <a href="{{ paper.detail_url }}" target="_blank">상세보기</a> |
    <a href="{{ paper.pdf_url }}" target="_blank">PDF</a>
</div>
<hr>
{% empty %}
<p>해당 관심 분야의 논문이 없습니다.</p>
{% endfor %}

{% endblock %}
