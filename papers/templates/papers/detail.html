{% extends "base.html" %}

{% block content %}
  <h2>{{ paper.title }}</h2>
  <p><strong>Authors:</strong> {{ paper.authors }}</p>
  <p><strong>Category:</strong> {{ paper.category }}</p>
  <hr>
  <h3>Summary</h3>
  <p>{{ paper.summary }}</p>
  <br>
  <a href="{% url 'paper_list' %}">목록으로 돌아가기</a>
{% endblock %}
